services:
  - type: web
    name: hr-outreach-tracker
    env: node
    rootDir: backend
    # npm install triggers the postinstall which runs scripts/install-browsers.js.
    # That wrapper tries --with-deps, falls back to plain install, and never
    # exits non-zero — so the build succeeds even if system packages can't be
    # installed (Render's Ubuntu image already has the Chromium deps).
    buildCommand: npm install
    startCommand: node src/index.js
    healthCheckPath: /api/health
    autoDeploy: true
