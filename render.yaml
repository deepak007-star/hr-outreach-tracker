services:
  # ── Backend API (Node/Express) ────────────────────────────────────────────
  - type: web
    name: hr-outreach-tracker
    env: node
    rootDir: backend
    buildCommand: npm install
    startCommand: node src/index.js
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production

  # ── Frontend (Vite/React static site) ────────────────────────────────────
  - type: web
    name: hr-outreach-tracker-frontend
    env: static
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    rootDir: frontend
    autoDeploy: true
    envVars:
      - key: VITE_API_URL
        value: https://hr-outreach-tracker.onrender.com
