services:
  postgres:
    image: postgres:16-alpine
    container_name: hr-outreach-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: hr_outreach_tracker
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: hr-outreach-backend
    ports:
      - "3001:3001"
    env_file:
      - ./backend/.env          # loads JWT_SECRET, GROQ_API_KEY, OAUTH keys, Razorpay, etc.
    environment:
      PORT: 3001
      FRONTEND_URL: http://localhost:5173
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/hr_outreach_tracker   # overrides .env (points to local postgres)
      TZ: Asia/Kolkata
    volumes:
      - ./backend/data:/app/data
      - ./backend/uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: hr-outreach-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata:
