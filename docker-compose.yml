services:
  backend:
    build: ./backend
    container_name: hr-outreach-backend
    ports:
      - "3001:3001"
    environment:
      PORT: 3001
      FRONTEND_URL: http://localhost:5173
    volumes:
      - ./backend/data:/app/data
      - ./backend/uploads:/app/uploads
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: hr-outreach-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    restart: unless-stopped
